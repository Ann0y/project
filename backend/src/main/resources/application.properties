spring.application.name=backend

# 服务端口
server.port=8080

# ===== 数据源（MariaDB / MySQL 均适用）=====
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/driving_school?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== MyBatis =====
# XML 映射文件位置（本项目的 SQL 全部用注解写在 Mapper 接口上，保留此项便于后续扩展）
mybatis.mapper-locations=classpath:mapper/*.xml
# 实体类别名包
mybatis.type-aliases-package=sch.whvcse.entity
# 数据库下划线字段自动映射为驼峰属性
mybatis.configuration.map-underscore-to-camel-case=true

# ===== Session =====
# 会话有效期；超过这个时间没有请求，登录状态就失效（滑动过期，有请求即续期）
server.servlet.session.timeout=30m
# 会话 Cookie 名（默认 JSESSIONID）
server.servlet.session.cookie.name=JSESSIONID

# ===== 业务配置 =====
# 身份证号 AES 加密密钥（需求 8：身份证号 AES 加密存储）
# 生产环境务必改成自己的密钥并通过环境变量注入：APP_CRYPTO_AESKEY=xxx
app.crypto.aes-key=driving-school-2026-secret-key

# 日期/时间统一按东八区序列化，避免前端拿到 UTC 时间
spring.jackson.time-zone=Asia/Shanghai
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
