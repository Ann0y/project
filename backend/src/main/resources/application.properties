spring.application.name=backend

# 服务端口
server.port=8080

# ===== 数据源（改成你自己的 MySQL 账号密码）=====
spring.datasource.url=jdbc:mysql://localhost:3306/driving_school?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== MyBatis =====
# XML 映射文件位置（src/main/resources/mapper/ 下）
mybatis.mapper-locations=classpath:mapper/*.xml
# 实体类别名包
mybatis.type-aliases-package=sch.whvcse.entity
# 数据库下划线字段自动映射为驼峰属性
mybatis.configuration.map-underscore-to-camel-case=true

# ===== Session =====
# 会话有效期；超过这个时间没有请求，登录状态就失效
server.servlet.session.timeout=30m
# 会话 Cookie 名（默认 JSESSIONID）
server.servlet.session.cookie.name=JSESSIONID
